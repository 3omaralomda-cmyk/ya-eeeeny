<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يا عيني 😂</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(circle at center, #171717 0%, #050505 65%, #000 100%);
    color: white;
    font-family: Tahoma, Arial, sans-serif;
}

.message {
    width: 92%;
    text-align: center;
    font-size: clamp(2rem, 7vw, 5rem);
    font-weight: 800;
    line-height: 1.7;
    text-shadow: 0 0 12px #ffffff55, 0 0 35px #ffffff22;
    animation: appear 1.6s ease both, glow 2.8s ease-in-out 1.6s infinite alternate;
}

.emoji {
    display: inline-block;
    margin-top: 12px;
    font-size: .8em;
    animation: bounce 1.8s ease-in-out infinite;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(24px) scale(.96); filter: blur(8px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ffffff33; }
    to { text-shadow: 0 0 18px #ffffff88, 0 0 45px #ffffff33; }
}

@keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
}
</style>
</head>
<body>
<main class="message">
    من اقوال عمرو الجايف:<br>
    يا عيني على الشقفة لما تبقى شرشوبة
    <div class="emoji">😂❤️</div>
</main>
</body>
</html>
